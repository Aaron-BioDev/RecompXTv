<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - RecompXTv</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0b0f19">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f19;
            --card: #161e2e;
            --border: #26334d;
            --brand: #8b5cf6;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 70% 20%, rgba(124, 58, 237, 0.18), transparent 45%), var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            text-align: center;
        }
        main {
            max-width: 460px;
            padding: 40px 28px;
            background: rgba(22, 30, 46, 0.8);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.7);
        }
        .code {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        h1 { font-size: 20px; margin: 16px 0 8px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
        a {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, filter 0.2s ease;
        }
        a:hover { transform: translateY(-1px); filter: brightness(1.1); }
        a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Esta página no existe</h1>
        <p>El enlace puede estar roto o la app que buscas cambió de ubicación. Vuelve al repositorio principal para ver todas las aplicaciones.</p>
        <a href="./">Volver a RecompXTv</a>
    </main>
</body>
</html>
